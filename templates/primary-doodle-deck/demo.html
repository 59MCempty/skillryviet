<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BútChìMàu — Primary Doodle Deck (HTML 16:9 &amp; .pptx)</title>
  <meta name="description" content="Slide Template Skill phong cách Primary Doodle Deck: tiêu đề viết tay tiếng Việt chuẩn dấu, bảng màu Cobalt–Đỏ–Vàng, sticker băng keo SVG thủ công, hỗ trợ VI | EN và xuất .pptx." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Shantell+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@4.0.1/dist/pptxgen.bundle.js" defer></script>
  <style>
    :root {
      --pd-bg: #FBF9F4;
      --pd-surface: #FFFFFF;
      --pd-ink: #131722;
      --pd-muted: #4B5565;
      --pd-cobalt: #1849D6;
      --pd-red: #D62828;
      --pd-yellow: #FFD43B;
      --pd-grid: #E6E1D6;
      --pd-desk: #EDE9DF;

      --font-hand: 'Shantell Sans', 'Segoe Print', cursive, sans-serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      --stage-scale: 1;
      --toolbar-h: 60px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--pd-desk);
      color: var(--pd-ink);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    :focus-visible {
      outline: 3px solid var(--pd-cobalt);
      outline-offset: 2px;
    }

    /* ================= STUDIO TOOLBAR ================= */
    .studio-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--toolbar-h);
      z-index: 50;
      background: rgba(251, 249, 244, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--pd-ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 12px;
    }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      background: var(--pd-yellow);
      border: 2px solid var(--pd-ink);
      border-radius: 999px;
      box-shadow: 2px 2px 0 var(--pd-ink);
      font-family: var(--font-hand);
      font-weight: 700;
      font-size: 15px;
      color: var(--pd-ink);
      white-space: nowrap;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--pd-cobalt);
      border: 1.5px solid var(--pd-ink);
      flex-shrink: 0;
    }

    .nav-btn, .tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      background: var(--pd-surface);
      border: 2px solid var(--pd-ink);
      border-radius: 9px;
      box-shadow: 2px 2px 0 var(--pd-ink);
      font-size: 13px;
      font-weight: 600;
      color: var(--pd-ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      white-space: nowrap;
    }

    .nav-btn:hover, .tool-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--pd-ink);
    }

    .nav-btn:active, .tool-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--pd-ink);
    }

    .nav-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
      box-shadow: 2px 2px 0 var(--pd-ink);
    }

    .tool-btn.is-active {
      background: var(--pd-cobalt);
      color: #FFFFFF;
    }

    .tool-btn.btn-primary {
      background: var(--pd-cobalt);
      color: #FFFFFF;
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      padding: 0 8px;
      min-width: 68px;
      text-align: center;
    }

    .lang-switch {
      display: inline-flex;
      border: 2px solid var(--pd-ink);
      border-radius: 9px;
      overflow: hidden;
      background: var(--pd-surface);
      box-shadow: 2px 2px 0 var(--pd-ink);
      height: 36px;
    }

    .lang-opt {
      padding: 0 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--pd-ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .lang-opt.is-active {
      background: var(--pd-ink);
      color: var(--pd-yellow);
    }

    .export-wrap {
      position: relative;
    }

    .export-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 280px;
      background: var(--pd-surface);
      border: 2px solid var(--pd-ink);
      border-radius: 12px;
      box-shadow: 4px 4px 0 var(--pd-ink);
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 80;
    }

    .export-menu.is-open {
      display: flex;
    }

    .export-menu-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--pd-muted);
      padding: 2px 4px;
    }

    .export-choice {
      text-align: left;
      padding: 9px 11px;
      border: 2px solid var(--pd-ink);
      border-radius: 8px;
      background: var(--pd-bg);
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background 0.12s ease;
    }

    .export-choice:hover {
      background: var(--pd-yellow);
    }

    .export-choice strong {
      font-size: 13px;
      font-weight: 700;
      color: var(--pd-ink);
    }

    .export-choice span {
      font-size: 11.5px;
      color: var(--pd-muted);
    }

    /* ================= STAGE VIEWPORT (DESKTOP) ================= */
    .stage-viewport {
      padding-top: var(--toolbar-h);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 18px;
    }

    .stage-frame {
      width: calc(1280px * var(--stage-scale));
      height: calc(720px * var(--stage-scale));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 14px auto;
    }

    .deck-stage {
      width: 1280px;
      height: 720px;
      transform: scale(var(--stage-scale));
      transform-origin: center center;
      position: relative;
      flex-shrink: 0;
    }

    /* ================= SLIDE CANVAS ================= */
    .slide {
      width: 1280px;
      height: 720px;
      background-color: var(--pd-bg);
      background-image: radial-gradient(var(--pd-grid) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      border: 3px solid var(--pd-ink);
      border-radius: 18px;
      box-shadow: 8px 8px 0 var(--pd-ink);
      position: relative;
      overflow: visible;
      padding: 46px 56px 42px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
    }

    .slide.is-active {
      display: flex;
    }

    .slide-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 4;
      min-height: 34px;
    }

    .chapter-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 999px;
      border: 2px solid var(--pd-ink);
      background: var(--pd-cobalt);
      color: #FFFFFF;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 2px 2px 0 var(--pd-ink);
    }

    .chapter-tag.tag-yellow {
      background: var(--pd-yellow);
      color: var(--pd-ink);
    }

    .chapter-tag.tag-red {
      background: var(--pd-red);
      color: #FFFFFF;
    }

    .slide-num {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--pd-muted);
      background: var(--pd-surface);
      border: 2px solid var(--pd-ink);
      border-radius: 8px;
      padding: 4px 10px;
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 3;
      padding: 16px 0 10px;
    }

    .slide-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 4;
      padding-top: 10px;
      border-top: 1.5px dashed #CFC9BC;
      font-size: 13px;
      color: var(--pd-muted);
      font-family: var(--font-mono);
    }

    .foot-progress {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .foot-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid var(--pd-ink);
      background: var(--pd-surface);
    }

    .foot-dot.is-done {
      background: var(--pd-cobalt);
    }

    .foot-dot.is-now {
      width: 24px;
      border-radius: 999px;
      background: var(--pd-yellow);
    }

    /* ================= TYPOGRAPHY & SKETCH PRIMITIVES ================= */
    .hand {
      font-family: var(--font-hand);
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .h1-cover {
      font-family: var(--font-hand);
      font-weight: 800;
      font-size: 54px;
      line-height: 1.14;
      margin: 0 0 18px;
      color: var(--pd-ink);
      letter-spacing: -0.01em;
    }

    .h2-slide {
      font-family: var(--font-hand);
      font-weight: 700;
      font-size: 36px;
      line-height: 1.18;
      margin: 0 0 22px;
      color: var(--pd-ink);
    }

    .h3-card {
      font-family: var(--font-hand);
      font-weight: 700;
      font-size: 22px;
      line-height: 1.25;
      margin: 0 0 8px;
      color: var(--pd-ink);
    }

    .lead-copy {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--pd-muted);
      max-width: 56ch;
      margin: 0;
    }

    .body-copy {
      font-size: 17px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--pd-muted);
      margin: 0;
    }

    .hl-yellow {
      display: inline-block;
      background: linear-gradient(180deg, transparent 36%, var(--pd-yellow) 36%, var(--pd-yellow) 92%, transparent 92%);
      padding: 0 6px;
      border-radius: 4px;
    }

    .ul-cobalt {
      position: relative;
      display: inline-block;
      padding-bottom: 4px;
      border-bottom: 5px solid var(--pd-cobalt);
    }

    .ul-red {
      position: relative;
      display: inline-block;
      padding-bottom: 4px;
      border-bottom: 5px solid var(--pd-red);
    }

    .sketch-card {
      background: var(--pd-surface);
      border: 2px solid var(--pd-ink);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--pd-ink);
      position: relative;
    }

    .sketch-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 11px;
      border: 2px solid var(--pd-ink);
      background: var(--pd-cobalt);
      color: #FFFFFF;
      font-family: var(--font-hand);
      font-weight: 700;
      font-size: 18px;
      box-shadow: 4px 4px 0 var(--pd-ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .sketch-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 var(--pd-ink);
    }

    /* ================= SVG STICKERS ================= */
    .sticker-tape {
      position: absolute;
      pointer-events: none;
      z-index: 5;
    }

    /* ================= SLIDE 01: COVER ================= */
    .cover-grid {
      display: grid;
      grid-template-columns: 7fr 5fr;
      gap: 44px;
      align-items: center;
    }

    .cover-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 26px;
    }

    .cover-author {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--pd-muted);
      padding: 8px 14px;
      background: var(--pd-surface);
      border: 2px solid var(--pd-ink);
      border-radius: 10px;
    }

    .cover-art-box {
      padding: 22px;
      background: var(--pd-surface);
      border: 2.5px solid var(--pd-ink);
      border-radius: 16px;
      box-shadow: 6px 6px 0 var(--pd-cobalt);
      transform: rotate(1.5deg);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .cover-art-caption {
      font-family: var(--font-hand);
      font-weight: 700;
      font-size: 16px;
      color: var(--pd-ink);
      background: var(--pd-yellow);
      border: 2px solid var(--pd-ink);
      padding: 4px 14px;
      border-radius: 999px;
    }

    /* ================= SLIDE 02: AGENDA ================= */
    .agenda-grid {
      display: grid;
      grid-template-columns: 5fr 7fr;
      gap: 42px;
      align-items: center;
    }

    .sticky-note {
      background: var(--pd-yellow);
      border: 2.5px solid var(--pd-ink);
      border-radius: 14px;
      box-shadow: 6px 6px 0 var(--pd-ink);
      padding: 44px 30px 32px;
      transform: rotate(-2deg);
      position: relative;
    }

    .sticky-note-clip {
      position: absolute;
      top: -22px;
      left: 28px;
    }

    .sticky-q {
      font-family: var(--font-hand);
      font-weight: 800;
      font-size: 30px;
      line-height: 1.24;
      color: var(--pd-ink);
      margin: 0 0 14px;
    }

    .sticky-sub {
      font-size: 16px;
      font-weight: 600;
      color: var(--pd-ink);
      margin: 0;
    }

    .agenda-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .agenda-item {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px 20px;
      background: var(--pd-surface);
      border: 2px solid var(--pd-ink);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--pd-ink);
    }

    .agenda-badge {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid var(--pd-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .agenda-badge.c-cobalt { background: var(--pd-cobalt); color: #FFFFFF; }
    .agenda-badge.c-red { background: var(--pd-red); color: #FFFFFF; }
    .agenda-badge.c-yellow { background: var(--pd-yellow); color: var(--pd-ink); }

    .agenda-item-title {
      font-family: var(--font-hand);
      font-weight: 700;
      font-size: 21px;
      color: var(--pd-ink);
      margin: 0 0 2px;
    }

    .agenda-item-desc {
      font-size: 15px;
      color: var(--pd-muted);
      margin: 0;
    }

    /* ================= SLIDE 03: PROBLEM (3 STAGGERED CARDS) ================= */
    .problem-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      align-items: stretch;
      margin-top: 16px;
    }

    .problem-card {
      padding: 36px 24px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 310px;
    }

    .problem-card.is-raised {
      transform: translateY(-16px);
      box-shadow: 6px 6px 0 var(--pd-cobalt);
    }

    .problem-stat {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 48px;
      line-height: 1.05;
      margin: 0 0 12px;
    }

    .problem-stat.s-red { color: var(--pd-red); }
    .problem-stat.s-cobalt { color: var(--pd-cobalt); }
    .problem-stat.s-ink {
      color: var(--pd-ink);
      background: var(--pd-yellow);
      display: inline-block;
      padding: 2px 10px;
      border-radius: 8px;
      border: 2px solid var(--pd-ink);
    }

    .problem-tag {
      margin-top: 18px;
      display: inline-block;
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1.5px solid var(--pd-ink);
      background: var(--pd-bg);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--pd-ink);
    }

    /* ================= SLIDE 04: SOLUTION FLOW ================= */
    .flow-row {
      display: grid;
      grid-template-columns: 1fr 74px 1fr 74px 1fr;
      align-items: center;
      gap: 8px;
      margin: 12px 0 26px;
    }

    .flow-station {
      padding: 24px 22px;
      min-height: 255px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .flow-step-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 12px;
      border-radius: 999px;
      border: 2px solid var(--pd-ink);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      align-self: flex-start;
      margin-bottom: 14px;
    }

    .flow-arrow-slot {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flow-banner {
      background: var(--pd-yellow);
      border: 2.5px solid var(--pd-ink);
      border-radius: 12px;
      box-shadow: 4px 4px 0 var(--pd-ink);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .flow-banner-text {
      font-family: var(--font-hand);
      font-weight: 700;
      font-size: 20px;
      color: var(--pd-ink);
      margin: 0;
    }

    .flow-banner-badge {
      background: var(--pd-surface);
      border: 2px solid var(--pd-ink);
      border-radius: 8px;
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ================= SLIDE 05: METRICS + CHART ================= */
    .metrics-grid {
      display: grid;
      grid-template-columns: 7fr 5fr;
      gap: 30px;
      align-items: stretch;
    }

    .chart-card {
      padding: 24px 26px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .chart-legend {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      font-weight: 600;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1.5px solid var(--pd-ink);
      flex-shrink: 0;
    }

    .kpi-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: space-between;
    }

    .kpi-card {
      padding: 18px 22px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-card.is-circled {
      background: #FFFDF5;
      border-color: var(--pd-ink);
    }

    .kpi-num {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 38px;
      line-height: 1.1;
      color: var(--pd-ink);
      position: relative;
      display: inline-block;
      align-self: flex-start;
    }

    .kpi-num.is-cobalt { color: var(--pd-cobalt); }
    .kpi-num.is-red { color: var(--pd-red); }

    .kpi-loop-svg {
      position: absolute;
      left: -20px;
      top: -11px;
      width: 142px;
      height: 64px;
      pointer-events: none;
    }

    /* ================= SLIDE 06: BEFORE / AFTER SPLIT ================= */
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: stretch;
    }

    .compare-col {
      padding: 26px 28px;
      border-radius: 16px;
      background: var(--pd-surface);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .compare-col.is-before {
      border: 2.5px dashed var(--pd-red);
      box-shadow: 4px 4px 0 rgba(214, 40, 40, 0.28);
    }

    .compare-col.is-after {
      border: 2.5px solid var(--pd-cobalt);
      box-shadow: 6px 6px 0 var(--pd-cobalt);
    }

    .compare-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--pd-bg);
    }

    .compare-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .compare-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 17px;
      font-weight: 500;
      color: var(--pd-ink);
    }

    .compare-bullet {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1.5px solid var(--pd-ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .compare-bullet.b-red { background: #FEE2E2; color: var(--pd-red); border-color: var(--pd-red); }
    .compare-bullet.b-cobalt { background: var(--pd-cobalt); color: #FFFFFF; }

    /* ================= SLIDE 07: ROADMAP TIMELINE ================= */
    .roadmap-wrap {
      position: relative;
      height: 410px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .roadmap-line-svg {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      height: 60px;
      pointer-events: none;
      z-index: 1;
    }

    .roadmap-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
      position: relative;
      z-index: 2;
      height: 100%;
    }

    .roadmap-col {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .roadmap-col.is-top {
      justify-content: flex-start;
      padding-top: 8px;
    }

    .roadmap-col.is-bottom {
      justify-content: flex-end;
      padding-bottom: 8px;
    }

    .roadmap-card {
      padding: 18px 18px 16px;
    }

    .roadmap-q {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      border: 1.5px solid var(--pd-ink);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* ================= SLIDE 08: NOTEBOOK TABLE ================= */
    .table-card {
      overflow: hidden;
      border: 2.5px solid var(--pd-ink);
      border-radius: 16px;
      box-shadow: 6px 6px 0 var(--pd-ink);
      background: var(--pd-surface);
      position: relative;
    }

    .notebook-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .notebook-table th {
      background: var(--pd-cobalt);
      color: #FFFFFF;
      font-family: var(--font-hand);
      font-weight: 700;
      font-size: 20px;
      padding: 16px 20px;
      border-bottom: 2.5px solid var(--pd-ink);
      border-right: 2px solid var(--pd-ink);
    }

    .notebook-table th:last-child {
      border-right: 0;
    }

    .notebook-table td {
      padding: 18px 20px;
      font-size: 17px;
      font-weight: 500;
      border-bottom: 1.5px solid var(--pd-grid);
      border-right: 1.5px solid var(--pd-grid);
      color: var(--pd-ink);
      vertical-align: middle;
    }

    .notebook-table td:last-child {
      border-right: 0;
    }

    .notebook-table tr:last-child td {
      border-bottom: 0;
    }

    .notebook-table tr.is-featured td {
      background: #FFFBEB;
    }

    .price-pill {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 8px;
      border: 2px solid var(--pd-ink);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 15px;
      background: var(--pd-yellow);
      color: var(--pd-ink);
    }

    /* ================= SLIDE 09: CLOSING CTA ================= */
    .closing-center {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      position: relative;
    }

    .closing-quote {
      font-family: var(--font-hand);
      font-weight: 800;
      font-size: 42px;
      line-height: 1.2;
      max-width: 27ch;
      margin: 0;
      color: var(--pd-ink);
    }

    .closing-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 960px;
    }

    .closing-step {
      padding: 18px 20px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .closing-step-num {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 2px solid var(--pd-ink);
      background: var(--pd-yellow);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-strip {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      padding: 12px 24px;
      background: var(--pd-cobalt);
      color: #FFFFFF;
      border: 2.5px solid var(--pd-ink);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--pd-ink);
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
    }

    .qa-bubble {
      position: absolute;
      right: 18px;
      top: -12px;
      background: var(--pd-red);
      color: #FFFFFF;
      border: 2.5px solid var(--pd-ink);
      border-radius: 18px;
      padding: 10px 18px;
      font-family: var(--font-hand);
      font-weight: 800;
      font-size: 22px;
      transform: rotate(7deg);
      box-shadow: 4px 4px 0 var(--pd-ink);
    }

    /* ================= SPEAKER NOTES DRAWER ================= */
    .notes-drawer {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: min(840px, calc(100vw - 32px));
      background: var(--pd-surface);
      border: 2.5px solid var(--pd-ink);
      border-radius: 14px;
      box-shadow: 6px 6px 0 var(--pd-ink);
      padding: 14px 18px;
      z-index: 60;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .notes-drawer.is-open {
      display: flex;
    }

    .notes-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--pd-cobalt);
    }

    .notes-text {
      font-size: 15px;
      color: var(--pd-ink);
      margin: 0;
      line-height: 1.5;
    }

    /* ================= OVERVIEW GRID MODAL ================= */
    .overview-modal {
      position: fixed;
      inset: 0;
      background: rgba(19, 23, 34, 0.72);
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .overview-modal.is-open {
      display: flex;
    }

    .overview-panel {
      width: min(1040px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      background: var(--pd-bg);
      border: 3px solid var(--pd-ink);
      border-radius: 18px;
      box-shadow: 8px 8px 0 var(--pd-ink);
      padding: 22px;
    }

    .overview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .thumb-card {
      text-align: left;
      padding: 14px 16px;
      background: var(--pd-surface);
      border: 2px solid var(--pd-ink);
      border-radius: 12px;
      box-shadow: 3px 3px 0 var(--pd-ink);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .thumb-card:hover {
      transform: translate(-1px, -1px);
      background: #FFFBEB;
    }

    .thumb-card.is-current {
      border-color: var(--pd-cobalt);
      box-shadow: 4px 4px 0 var(--pd-cobalt);
      background: #EFF6FF;
    }

    .thumb-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--pd-cobalt);
    }

    .thumb-title {
      font-family: var(--font-hand);
      font-weight: 700;
      font-size: 17px;
      color: var(--pd-ink);
      line-height: 1.3;
    }

    .thumb-sub {
      font-size: 13px;
      color: var(--pd-muted);
      line-height: 1.4;
    }

    /* ================= TOAST ================= */
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 90;
      background: var(--pd-ink);
      color: var(--pd-yellow);
      border: 2px solid var(--pd-yellow);
      border-radius: 10px;
      padding: 10px 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 4px 4px 0 rgba(19, 23, 34, 0.3);
      display: none;
    }

    .toast.is-show {
      display: block;
    }

    /* ================= MOBILE READER (< 768px — GATE 2: 375px SAFE) ================= */
    @media (max-width: 767px) {
      body {
        background: var(--pd-desk);
        overflow-x: hidden;
      }

      .studio-bar {
        padding: 0 10px;
        gap: 6px;
        height: 54px;
      }

      .brand-pill {
        padding: 4px 9px;
        font-size: 13px;
      }

      .hide-mobile {
        display: none !important;
      }

      .nav-btn, .tool-btn {
        height: 32px;
        padding: 0 9px;
        font-size: 12px;
      }

      .lang-switch {
        height: 32px;
      }

      .lang-opt {
        padding: 0 8px;
        font-size: 11px;
      }

      .stage-viewport {
        padding: 66px 12px 28px;
        display: block;
        min-height: auto;
      }

      .stage-frame {
        width: 100%;
        height: auto;
        margin: 0;
        display: block;
      }

      .deck-stage {
        width: 100%;
        height: auto;
        transform: none !important;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .slide {
        display: flex !important;
        width: 100%;
        height: auto;
        min-height: 0;
        padding: 20px 16px 18px;
        border-radius: 14px;
        box-shadow: 4px 4px 0 var(--pd-ink);
        overflow: hidden;
      }

      .slide > .sticker-tape {
        display: none;
      }

      .cover-grid > *,
      .agenda-grid > *,
      .problem-grid > *,
      .metrics-grid > *,
      .compare-grid > *,
      .roadmap-grid > *,
      .closing-steps > * {
        min-width: 0;
      }

      .cover-art-box svg {
        max-width: 100%;
        height: auto;
      }

      .lead-copy {
        max-width: 100%;
      }

      .slide-body {
        padding: 14px 0 12px;
      }

      .h1-cover {
        font-size: 30px;
        line-height: 1.2;
      }

      .h2-slide {
        font-size: 24px;
        line-height: 1.24;
        margin-bottom: 14px;
      }

      .h3-card {
        font-size: 19px;
      }

      .lead-copy {
        font-size: 16px;
      }

      .body-copy, .compare-list li, .notebook-table td {
        font-size: 15px;
      }

      .cover-grid,
      .agenda-grid,
      .problem-grid,
      .metrics-grid,
      .compare-grid,
      .roadmap-grid,
      .closing-steps,
      .overview-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .cover-art-box {
        transform: none;
        padding: 16px;
      }

      .sticky-note {
        transform: none;
        padding: 32px 18px 20px;
      }

      .sticky-q {
        font-size: 23px;
      }

      .problem-card {
        min-height: 0;
        padding: 28px 18px 18px;
      }

      .problem-card.is-raised {
        transform: none;
      }

      .problem-stat {
        font-size: 36px;
      }

      .flow-row {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .flow-station {
        min-height: 0;
        padding: 18px 16px;
      }

      .flow-arrow-slot {
        transform: rotate(90deg);
        height: 36px;
      }

      .flow-banner {
        flex-direction: column;
        align-items: flex-start;
        padding: 14px 16px;
      }

      .flow-banner-text {
        font-size: 17px;
      }

      .kpi-loop-svg {
        width: 145px;
        height: 54px;
        left: -10px;
        top: -8px;
      }

      .roadmap-wrap {
        height: auto;
      }

      .roadmap-line-svg {
        display: none;
      }

      .roadmap-col.is-top,
      .roadmap-col.is-bottom {
        padding: 0;
      }

      .table-card {
        overflow-x: auto;
      }

      .notebook-table th {
        font-size: 15px;
        padding: 11px 12px;
      }

      .notebook-table td {
        padding: 11px 12px;
        white-space: nowrap;
      }

      .closing-quote {
        font-size: 26px;
      }

      .qa-bubble {
        position: static;
        transform: rotate(0deg);
        align-self: flex-end;
        font-size: 17px;
        padding: 6px 14px;
      }

      .contact-strip {
        font-size: 13px;
        padding: 10px 14px;
        gap: 10px;
      }

      .sticker-tape {
        transform: scale(0.75);
        top: 6px !important;
      }

      .problem-card .sticker-tape {
        top: -14px !important;
      }

      .export-menu {
        width: 248px;
        right: -4px;
      }
    }

    /* ================= PRINT / PDF 16:9 ================= */
    @media print {
      @page {
        size: 13.333in 7.5in;
        margin: 0;
      }

      html, body {
        background: var(--pd-bg);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .studio-bar,
      .notes-drawer,
      .overview-modal,
      .toast {
        display: none !important;
      }

      .stage-viewport,
      .stage-frame,
      .deck-stage {
        padding: 0 !important;
        margin: 0 !important;
        width: 1280px !important;
        height: auto !important;
        transform: none !important;
        display: block !important;
      }

      .slide {
        display: flex !important;
        width: 1280px !important;
        height: 720px !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        break-after: page;
        page-break-after: always;
      }

      .slide:last-child {
        break-after: auto;
        page-break-after: auto;
      }
    }
  </style>
</head>

          <path d="M4 25 C18 10, 38 34, 57 18" stroke="#131722" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M47 12 L60 17 L53 30" stroke="#1849D6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
    }

    function redLoopSVG() {
      return `
        <svg class="kpi-loop-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 68" fill="none">
          <path d="M16 38 C14 14, 154 6, 166 30 C176 52, 34 62, 12 42 C4 34, 24 14, 72 11" stroke="#D62828" stroke-width="3.8" stroke-linecap="round"/>
        </svg>`;
    }

    function roadmapLineSVG() {
      return `
        <svg class="roadmap-line-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 60" fill="none" preserveAspectRatio="none">
          <path d="M20 30 Q 180 12, 310 30 T 600 30 T 890 30 T 1138 30" stroke="#131722" stroke-width="4" stroke-linecap="round"/>
          <path d="M1122 18 L1144 30 L1122 42" stroke="#1849D6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="145" cy="24" r="11" fill="#1849D6" stroke="#131722" stroke-width="3"/>
          <circle cx="445" cy="34" r="11" fill="#FFD43B" stroke="#131722" stroke-width="3"/>
          <circle cx="745" cy="24" r="11" fill="#D62828" stroke="#131722" stroke-width="3"/>
          <circle cx="1040" cy="34" r="11" fill="#1849D6" stroke="#131722" stroke-width="3"/>
        </svg>`;
    }

    function buildChartSVG(s) {
      const W = 610, H = 295, padL = 44, padB = 38, padT = 18, padR = 16;
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;
      let bars = '';
      // Horizontal grid lines 0, 25, 50, 75, 100
      for (let v = 0; v <= 100; v += 25) {
        const y = padT + chartH - (v / 100) * chartH;
        bars += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#E6E1D6" stroke-width="1.5" stroke-dasharray="4 4"/>`;
        bars += `<text x="${padL - 10}" y="${y + 4}" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#4B5565">${v}%</text>`;
      }
      const groupW = chartW / s.labels.length;
      s.labels.forEach((lbl, idx) => {
        const cx = padL + idx * groupW + groupW / 2;
        const v1 = s.valuesNew[idx];
        const v2 = s.valuesOld[idx];
        const h1 = (v1 / 100) * chartH;
        const h2 = (v2 / 100) * chartH;
        const y1 = padT + chartH - h1;
        const y2 = padT + chartH - h2;
        // New series (Cobalt)
        bars += `<rect x="${cx - 34}" y="${y1}" width="30" height="${h1}" rx="6" fill="#1849D6" stroke="#131722" stroke-width="2"/>`;
        bars += `<text x="${cx - 19}" y="${y1 - 6}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#1849D6">${v1}%</text>`;
        // Old series (Red)
        bars += `<rect x="${cx + 4}" y="${y2}" width="30" height="${h2}" rx="6" fill="#D62828" stroke="#131722" stroke-width="2"/>`;
        bars += `<text x="${cx + 19}" y="${y2 - 6}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#D62828">${v2}%</text>`;
        // X-axis label
        bars += `<text x="${cx}" y="${H - 12}" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#131722">${lbl}</text>`;
      });
      return `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + chartH}" stroke="#131722" stroke-width="2"/>
          <line x1="${padL}" y1="${padT + chartH}" x2="${W - padR}" y2="${padT + chartH}" stroke="#131722" stroke-width="2"/>
          ${bars}
        </svg>`;
    }

       3. RENDERING 9 DISTINCT SLIDE LAYOUTS

    let currentLang = 'vi';
    let currentSlide = 0;

    function tagClass(tone) {
      if (tone === 'yellow') return 'chapter-tag tag-yellow';

    function renderFooter(index, total, brandText) {

      document.getElementById('ui-exp-opt1-d').textContent = ui.expOpt1D;
      document.getElementById('ui-exp-opt2-t').textContent = ui.expOpt2T;

    function renderOverview() {
      const data = DECK_DATA[currentLang];
      const grid = document.getElementById('overview-grid');
      grid.innerHTML = data.slides.map((s, idx) => {
        const headline = s.titlePre ? `${s.titlePre} ${s.titleHighlight || s.titleAccent || ''}` : (s.stickyQuestion || s.quote);
        return `
          <button type="button" class="thumb-card ${idx === currentSlide ? 'is-current' : ''}" onclick="goToSlide(${idx}); toggleOverview(false);">

    function goToSlide(idx) {
      const total = DECK_DATA[currentLang].slides.length;
      currentSlide = Math.max(0, Math.min(total - 1, idx));
      updateUI();
      renderOverview();

    function resizeStage() {
      if (window.innerWidth < 768) {
        document.documentElement.style.setProperty('--stage-scale', '1');
        return;
      }
      const padW = 48;
      const padH = 92;
      const availW = Math.max(320, window.innerWidth - padW);
      const availH = Math.max(240, window.innerHeight - padH);
      const scale = Math.min(availW / 1280, availH / 720, 1.15);
      document.documentElement.style.setProperty('--stage-scale', scale.toFixed(4));
    }

    function toggleOverview(force) {
      const modal = document.getElementById('overview-modal');

    function showToast(msg, ms = 3200) {
      const el = document.getElementById('toast');

    /* =====================================================================
       4. HYBRID .PPTX EXPORTER (NATIVE EDITABLE + 2X PNG STICKERS)
       ===================================================================== */
    const PX_TO_IN = 13.3333 / 1280;
    const px = (v) => Number((v * PX_TO_IN).toFixed(3));
    const C = {
      bg: 'FBF9F4',
      surface: 'FFFFFF',
      ink: '131722',
      muted: '4B5565',
      cobalt: '1849D6',
      red: 'D62828',
      yellow: 'FFD43B',
      grid: 'E6E1D6',
      softRed: 'FEE2E2',
      softYellow: 'FFFBEB'
    };

    function svgStringToPngDataUrl(svgString, widthPx, heightPx) {
      return new Promise((resolve, reject) => {
        const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const scale = 2;
          const canvas = document.createElement('canvas');
          canvas.width = widthPx * scale;
          canvas.height = heightPx * scale;
          const ctx = canvas.getContext('2d');
          ctx.scale(scale, scale);
          ctx.drawImage(img, 0, 0, widthPx, heightPx);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = (err) => {
          URL.revokeObjectURL(url);
          reject(err);
        };
        img.src = url;
      });
    }

    function buildDotGridPng() {
      const canvas = document.createElement('canvas');
      canvas.width = 1280;
      canvas.height = 720;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FBF9F4';
      ctx.fillRect(0, 0, 1280, 720);
      ctx.fillStyle = '#E6E1D6';
      for (let x = 12; x < 1280; x += 24) {
        for (let y = 12; y < 720; y += 24) {
          ctx.beginPath();
          ctx.arc(x, y, 1.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      return canvas.toDataURL('image/png');
    }

    function addSketchCard(pptx, slide, xPx, yPx, wPx, hPx, opts = {}) {
      const shadowColor = opts.shadowColor || C.ink;
      slide.addShape(pptx.ShapeType.roundRect, {
        x: px(xPx + 5),
        y: px(yPx + 5),
        w: px(wPx),
        h: px(hPx),
        fill: { color: shadowColor },
        line: { color: shadowColor, width: 0 },
        rectRadius: 0.08
      });
      slide.addShape(pptx.ShapeType.roundRect, {
        x: px(xPx),
        y: px(yPx),
        w: px(wPx),
        h: px(hPx),
        fill: { color: opts.fill || C.surface },
        line: { color: opts.border || C.ink, width: 1.5, dashType: opts.dash ? 'dash' : 'solid' },
        rectRadius: 0.08
      });
    }

    function addSlideChrome(pptx, slide, s, total, footBrand, fonts) {
      const tagFill = s.tagTone === 'yellow' ? C.yellow : (s.tagTone === 'red' ? C.red : C.cobalt);
      const tagInk = s.tagTone === 'yellow' ? C.ink : C.surface;
      slide.addShape(pptx.ShapeType.roundRect, {
        x: px(56), y: px(32), w: px(240), h: px(32),
        fill: { color: tagFill }, line: { color: C.ink, width: 1.25 }, rectRadius: 0.5
      });
      slide.addText(s.chapter, {
        x: px(56), y: px(32), w: px(240), h: px(32),
        fontFace: fonts.mono, fontSize: 10, bold: true, color: tagInk, align: 'center', valign: 'middle'
      });

      slide.addShape(pptx.ShapeType.roundRect, {
        x: px(1140), y: px(32), w: px(84), h: px(32),
        fill: { color: C.surface }, line: { color: C.ink, width: 1.25 }, rectRadius: 0.2
      });
      slide.addText(`${s.id} / 0${total}`, {
        x: px(1140), y: px(32), w: px(84), h: px(32),
        fontFace: fonts.mono, fontSize: 10, bold: true, color: C.muted, align: 'center', valign: 'middle'
      });

      slide.addShape(pptx.ShapeType.line, {
        x: px(56), y: px(666), w: px(1168), h: 0,
        line: { color: C.grid, width: 1, dashType: 'dash' }
      });
      slide.addText(footBrand, {
        x: px(56), y: px(674), w: px(500), h: px(24),
        fontFace: fonts.mono, fontSize: 9.5, color: C.muted, valign: 'middle'

      e.stopPropagation();
      const open = !exportMenu.classList.contains('is-open');
      exportMenu.classList.toggle('is-open', open);
      exportToggle.setAttribute('aria-expanded', String(open));
    });

    document.getElementById('export-design-font').addEventListener('click', () => {
      exportMenu.classList.remove('is-open');
      exportToPptx('design');
    });

    document.getElementById('export-safe-font').addEventListener('click', () => {
      exportMenu.classList.remove('is-open');
      exportToPptx('safe');
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.export-wrap')) {
        exportMenu.classList.remove('is-open');
        exportToggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.getElementById('overview-modal').addEventListener('click', (e) => {
      if (e.target.id === 'overview-modal') toggleOverview(false);
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        if (window.innerWidth >= 768) {
          e.preventDefault();
          goToSlide(currentSlide + 1);
        }
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        if (window.innerWidth >= 768) {
          e.preventDefault();
          goToSlide(currentSlide - 1);
        }
      } else if (e.key === 'Home') {
        goToSlide(0);
      } else if (e.key === 'End') {
        goToSlide(DECK_DATA[currentLang].slides.length - 1);
      } else if (e.key === 'g' || e.key === 'G') {
        toggleOverview();
      } else if (e.key === 'n' || e.key === 'N') {
        toggleNotes();
      } else if (e.key === 'f' || e.key === 'F') {
        document.getElementById('btn-full').click();
      } else if (e.key === 'Escape') {
        toggleOverview(false);
        toggleNotes(false);
        exportMenu.classList.remove('is-open');
      }
    });

    window.addEventListener('resize', resizeStage);
    renderDeck();
  </script>
</body>
</html>
