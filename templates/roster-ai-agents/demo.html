<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster · Xem trước</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #F7F8F2; }
  iframe { display: block; width: 100%; height: 100dvh; border: 0; }
</style>
<iframe id="preview" title="Roster · Bản xem trước VI và EN" sandbox="allow-scripts"
  src="../../skills/roster-ai-agents/templates/demo.html"></iframe>
<script>
  const locale = new URL(location.href).searchParams.get("lang");
  if (locale === "en" || locale === "vi") {
    const preview = document.querySelector("#preview");
    const url = new URL(preview.getAttribute("src"), location.href);
    url.searchParams.set("lang", locale);
    preview.src = url;
  }
</script>
</html>
